name: botifactory-container

run-name: botifactory-container

on:
  push:
    branches:
      - main

env:
  IMAGE: gitea.izzys.place/izzy/botifactory

jobs:
  build-image:
    runs-on: nix-build
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Build image
        run: nix build -L .#image -o image.tar.gz

      - name: Push
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        # The runner host's /etc/containers/registries.conf is in the v1
        # format, which skopeo refuses to load. The push names the registry
        # in full, so give skopeo an empty v2 config of its own instead.
        run: |
          export CONTAINERS_REGISTRIES_CONF="$(mktemp)"
          echo 'unqualified-search-registries = []' > "$CONTAINERS_REGISTRIES_CONF"
          for t in latest "${{ github.sha }}"; do
            nix run --inputs-from . nixpkgs#skopeo -- --insecure-policy copy \
              --dest-creds "izzy:${REGISTRY_TOKEN}" \
              docker-archive:image.tar.gz "docker://${IMAGE}:${t}"
          done
